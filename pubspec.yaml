name: aud_audio_ui_controls
description: "Knobs, sliders, wheels, ribbon, joystick and XY pad of the Audanika Audio Engine, modeled on AudioKit Controls"
version: 0.2.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_ui_controls
repository: https://github.com/audaudio/aud_audio_ui_controls

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  helix: ^1.14.0
  dna_audanika: ^0.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

